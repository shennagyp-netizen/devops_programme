name: Temporary V2 test diagnostics

on:
  push:
    branches:
      - codex/v2-cognitive-podcast-tts

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund
      - name: Run tests and capture output
        working-directory: app
        shell: bash
        run: |
          set +e
          npm test > ../vitest-diagnostic.log 2>&1
          code=$?
          echo "exit_code=$code" >> ../vitest-diagnostic.log
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostic
          path: vitest-diagnostic.log
          if-no-files-found: error
