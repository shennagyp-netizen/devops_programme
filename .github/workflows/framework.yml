name: Learning Framework MVP

on:
  push:
    branches: ["**"]
    paths:
      - "framework/**"
      - ".github/workflows/framework.yml"
  pull_request:
    paths:
      - "framework/**"
      - ".github/workflows/framework.yml"

permissions:
  contents: read

jobs:
  framework:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: framework
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: framework/package.json
      - name: Install framework dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and boundary tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
