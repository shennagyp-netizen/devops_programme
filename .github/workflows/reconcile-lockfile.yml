name: V2 lockfile reconciliation

on:
  push:
    branches:
      - codex/v2-cognitive-podcast-tts

permissions:
  contents: write

jobs:
  reconcile-lockfile:
    if: "!contains(github.event.head_commit.message, '[lock-sync]')"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Reconcile lockfile
        working-directory: app
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit reconciled lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app/package-lock.json; then
            echo "package-lock.json already reconciled"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          git commit -m "chore: reconcile npm lockfile [lock-sync]"
          git push
