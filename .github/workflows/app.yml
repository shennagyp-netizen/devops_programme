name: devops-programme-app
on:
  push:
    paths: ["app/**","podcasts/**","scripts/**",".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**","podcasts/**","scripts/**",".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: devops-programme-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full_programme_gate:
    name: full-programme-gate
    runs-on: ubuntu-slim
    steps:
      - name: Setup maintained Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3

      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          node --version
          npm --version
          git --version

      - name: Checkout repository
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          path: repo

      - name: Install dependencies
        working-directory: repo/app
        run: npm install

      - name: Content contract
        working-directory: repo/app
        run: npm run check:content

      - name: Assessment contract
        working-directory: repo/app
        run: npm run check:assessment

      - name: Diagnostics contract
        working-directory: repo/app
        run: npm run check:diagnostics

      - name: Project contract
        working-directory: repo/app
        run: npm run check:projects

      - name: Platform adapter contract
        working-directory: repo/app
        run: npm run check:platforms

      - name: Hands-on contract
        working-directory: repo/app
        run: npm run check:hands-on

      - name: Beginner completeness
        working-directory: repo/app
        run: npm run check:beginner

      - name: Intermediate completeness
        working-directory: repo/app
        run: npm run check:intermediate

      - name: Advanced completeness
        working-directory: repo/app
        run: npm run check:advanced

      - name: Programme completeness
        working-directory: repo/app
        run: npm run check:programme

      - name: Runtime verification contract
        working-directory: repo/app
        run: npm run check:runtime

      - name: Authenticated progress architecture contract
        working-directory: repo/app
        run: npm run check:progress

      - name: Unit tests
        working-directory: repo/app
        run: npm run test:unit

      - name: Integration assessment banks
        working-directory: repo/app
        run: npx vitest run tests/integration/assessment-banks.integration.test.mjs

      - name: Integration beginner course
        working-directory: repo/app
        run: npx vitest run tests/integration/beginner-course.integration.test.mjs

      - name: Integration contract validators
        working-directory: repo/app
        run: npx vitest run tests/integration/contract-validators.integration.test.mjs

      - name: Integration local terminal agent
        working-directory: repo/app
        run: npx vitest run tests/integration/local-terminal-agent.integration.test.mjs

      - name: Integration platform and content
        working-directory: repo/app
        run: npx vitest run tests/integration/platform-and-content.integration.test.mjs

      - name: Integration programme
        working-directory: repo/app
        run: npx vitest run tests/integration/programme.integration.test.mjs

      - name: Integration progress action
        working-directory: repo/app
        run: npx vitest run tests/integration/progress-action.test.mjs

      - name: Integration runtime runner
        working-directory: repo/app
        run: npx vitest run tests/integration/runtime-runner.integration.test.mjs

      - name: TypeScript typecheck
        working-directory: repo/app
        run: npm run typecheck

      - name: Next.js production build
        working-directory: repo/app
        run: npx next build
