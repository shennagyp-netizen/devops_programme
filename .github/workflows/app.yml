name: devops-programme-app
on:
  push:
    paths: ["app/**","podcasts/**","scripts/**",".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**","podcasts/**","scripts/**",".github/workflows/app.yml"]
permissions:
  contents: read
  pull-requests: write

jobs:
  beginner_gate:
    name: beginner-gate
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Runner diagnostics
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          command -v git
          git --version
          command -v node
          node --version
          command -v npm
          npm --version

      - name: Checkout repository without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf repo
          git init repo
          cd repo
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach "${GITHUB_SHA}"

      - name: Beginner structural contract
        working-directory: repo/app
        run: node ../scripts/check-beginner-gate.mjs

      - name: Beginner unit tests
        working-directory: repo/app
        run: |
          npm install
          npm exec vitest run tests/unit/beginner-course.test.mjs

      - name: Beginner integration tests
        working-directory: repo/app
        run: npm exec vitest run tests/integration/beginner-course.integration.test.mjs

      - name: Beginner completeness validator
        working-directory: repo/app
        run: npm run check:beginner

      - name: Runtime contract tests
        working-directory: repo/app
        run: |
          npm exec vitest run tests/unit/runtimeVerification.test.mjs tests/unit/remote-runtime-core.test.mjs tests/integration/runtime-runner.integration.test.mjs tests/integration/local-terminal-agent.integration.test.mjs
          node ../scripts/check-runtime-verification-contract.mjs
