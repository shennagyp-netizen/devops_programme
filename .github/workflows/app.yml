name: devops-programme-app
on:
  push:
    paths: ["app/**","podcasts/**","scripts/**",".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**","podcasts/**","scripts/**",".github/workflows/app.yml"]
permissions:
  contents: read
  pull-requests: write

jobs:
  beginner_diagnostic:
    name: beginner-diagnostic
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark diagnostic start
        uses: actions/github-script@v7
        with:
          script: |
            const content = [
              "Beginner diagnostic started.",
              "run=" + context.runId,
              "event=" + context.eventName,
              "sha=" + context.sha,
              "runner=" + process.env.RUNNER_OS
            ].join("\n");
            const branch = context.payload.pull_request?.head?.ref;
            if (!branch) return;
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "ci-debug/beginner-" + context.runId + ".txt",
              message: "ci: record Beginner diagnostic start",
              content: Buffer.from(content).toString("base64"),
              branch
            });

      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-node@v4
        id: setup
        with:
          node-version: 22

      - name: Run Beginner diagnostic stages
        id: stages
        shell: bash
        run: |
          set +e
          report="ci-debug-local.txt"
          : > "$report"

          run_stage() {
            name="$1"
            shift
            echo "===== $name =====" >> "$report"
            echo "COMMAND: $*" >> "$report"
            "$@" > /tmp/beginner-stage.out 2>&1
            code=$?
            echo "EXIT: $code" >> "$report"
            tail -n 250 /tmp/beginner-stage.out >> "$report"
            echo >> "$report"
          }

          run_stage "npm-install" npm install
          run_stage "beginner-structural" node ../scripts/check-beginner-gate.mjs
          run_stage "beginner-unit" npm exec vitest run tests/unit/beginner-course.test.mjs
          run_stage "beginner-integration" npm exec vitest run tests/integration/beginner-course.integration.test.mjs
          run_stage "beginner-completeness" npm run check:beginner

          exit 0

      - name: Publish Beginner diagnostic report
        if: always()
        uses: actions/github-script@v7
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          STAGES: ${{ steps.stages.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const branch = context.payload.pull_request?.head?.ref;
            if (!branch) return;

            let report = [
              "Beginner diagnostic final report",
              "run=" + context.runId,
              "sha=" + context.sha,
              "checkout=" + process.env.CHECKOUT,
              "setup=" + process.env.SETUP,
              "stages=" + process.env.STAGES,
              ""
            ].join("\n");

            if (fs.existsSync("ci-debug-local.txt")) {
              report += fs.readFileSync("ci-debug-local.txt", "utf8");
            }

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "ci-debug/beginner-" + context.runId + "-final.txt",
              message: "ci: record Beginner diagnostic result",
              content: Buffer.from(report).toString("base64"),
              branch
            });
  beginner_gate:
    name: beginner-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        id: install
        run: npm install

      - name: Beginner structural contract
        id: structural
        run: node ../scripts/check-beginner-gate.mjs

      - name: Beginner unit tests
        id: unit
        run: npm exec vitest run tests/unit/beginner-course.test.mjs

      - name: Beginner integration tests
        id: integration
        run: npm exec vitest run tests/integration/beginner-course.integration.test.mjs

      - name: Beginner completeness validator
        id: completeness
        run: npm run check:beginner

      - name: Report Beginner gate outcomes
        if: always()
        uses: actions/github-script@v7
        env:
          INSTALL: ${{ steps.install.outcome }}
          STRUCTURAL: ${{ steps.structural.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          INTEGRATION: ${{ steps.integration.outcome }}
          COMPLETENESS: ${{ steps.completeness.outcome }}
        with:
          script: |
            if (context.eventName !== "pull_request") return;
            const body = [
              "### Beginner gate diagnostic",
              "",
              "| Stage | Outcome |",
              "|---|---|",
              "| npm install | " + process.env.INSTALL + " |",
              "| structural contract | " + process.env.STRUCTURAL + " |",
              "| unit tests | " + process.env.UNIT + " |",
              "| integration tests | " + process.env.INTEGRATION + " |",
              "| completeness validator | " + process.env.COMPLETENESS + " |"
            ].join("\\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and validation diagnostic
        shell: bash
        run: |
          set +e
          mkdir -p ci-report
          : > ci-report/summary.txt
          failed=0

          run_stage() {
            name="$1"
            safe_name="$(printf '%s' "$name" | tr ' ' '_')"
            shift
            echo "===== $name =====" | tee -a ci-report/summary.txt
            "$@" > "ci-report/$safe_name.log" 2>&1
            code=$?
            echo "exit=$code" | tee -a ci-report/summary.txt
            cat "ci-report/$safe_name.log"
            if [ "$code" -ne 0 ]; then
              failed=1
            fi
          }

          run_stage "install" npm install
          run_stage "sync_podcasts" npm run sync:podcasts
          run_stage "check_content" npm run check:content
          run_stage "check_assessment" npm run check:assessment
          run_stage "check_diagnostics" npm run check:diagnostics
          run_stage "check_projects" npm run check:projects
          run_stage "check_platforms" npm run check:platforms
          run_stage "check_hands_on" npm run check:hands-on
          run_stage "check_beginner" npm run check:beginner
          run_stage "check_intermediate" npm run check:intermediate
          run_stage "check_advanced" npm run check:advanced
          run_stage "check_programme" npm run check:programme
          run_stage "check_runtime" npm run check:runtime
          run_stage "unit_tests" npm run test:unit
          run_stage "integration_tests" npm run test:integration
          run_stage "typescript" tsc -b
          run_stage "vite_build" vite build

          echo "===== podcast_review =====" | tee -a ci-report/summary.txt
          npm run review:podcast > ci-report/podcast_review.log 2>&1
          review_code=$?
          echo "exit=$review_code (warning-only)" | tee -a ci-report/summary.txt
          cat ci-report/podcast_review.log

          cp ci-report/summary.txt build.log
          exit "$failed"

      - name: Upload CI diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devops-app-ci-report
          path: |
            app/ci-report
            app/build.log
