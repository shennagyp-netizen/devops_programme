name: devops-programme-browser-e2e

on:
  push:
    paths:
      - "app/**"
      - "exams/**"
      - "scripts/**"
      - ".github/workflows/e2e-browser.yml"
  pull_request:
    paths:
      - "app/**"
      - "exams/**"
      - "scripts/**"
      - ".github/workflows/e2e-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    name: real-user-browser-e2e
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: devops_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d devops_e2e"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: app

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/devops_e2e
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install application dependencies
        run: npm install --no-audit --no-fund

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-user browser E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload E2E screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: app/test-results/
          if-no-files-found: ignore
          retention-days: 14
