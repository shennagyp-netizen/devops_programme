name: runner-probe
on:
  push:
    paths:
      - ".github/workflows/runner-probe.yml"
  pull_request:
    paths:
      - ".github/workflows/runner-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Prove hosted runner execution
        run: |
          set -eux
          echo "runner-probe-ok"
          uname -a
